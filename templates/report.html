<!DOCTYPE html>
<html>
<head>
    <title>Monthly Report</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f5f5f5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #222;
            color: white;
        }

        a {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Monthly Attendance Report</h1>

    <a href="/dashboard?pin=1234">Back to Dashboard</a>

    <table>
        <tr>
            <th>Employee</th>
            <th>Present Days</th>
            <th>Leave Days</th>
            <th>Leaves Remaining</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.present }}</td>
            <td>{{ row.leave }}</td>
            <td>{{ row.leaves_remaining }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
